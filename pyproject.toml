[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capital-manifold"
version = "0.1.0"
description = "Planetary Balance-Sheet Network Dynamics, Siphon Forensics, and Adversarial Macro-Financial Graph Engine."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Conner Kupferberg" }
]
keywords = [
    "macro-finance",
    "balance-sheet",
    "graph-algorithms",
    "forensics",
    "duckdb",
    "siphon-detection",
    "procedural-graph-engine",
    "central-banking",
    "sovereign-debt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "networkx>=3.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "uvicorn>=0.28.0",
]

[project.scripts]
capital-manifold = "capital_manifold.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
